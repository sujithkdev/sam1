name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/dev.lock
      - run: python -m ruff check backend endpoint manage.py tests
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements/server.lock --disable-pip
