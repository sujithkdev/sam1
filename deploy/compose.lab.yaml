# Isolated deployment verification. Never use production credentials/data here.
name: behedr-phase2
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      EDR_ENV: production
      EDR_JWT_SECRET: ${EDR_JWT_SECRET:?Generate the lab environment first}
      EDR_HOST: 0.0.0.0
      EDR_DATA_DIR: /app/var/server
    volumes:
      - lab-server-data:/app/var/server
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
  proxy:
    image: ${BEHEDR_CADDY_IMAGE:?Set the pinned Caddy image}
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile.lab:/etc/caddy/Caddyfile:ro
      - lab-caddy-data:/data
      - lab-caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
volumes:
  lab-server-data:
  lab-caddy-data:
  lab-caddy-config:
